<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc">
<title id="title">Muhammad Omar</title><desc id="desc">C# developer. Useful tools, thoughtful interfaces. C#, .NET, Windows Forms.</desc>
