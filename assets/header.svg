<text x="44" y="140" fill="#f1f5f9" font-size="62" font-weight="700" letter-spacing="-2">Muhammad Omar<tspan fill="#22d3ee">.</tspan></text>
<text x="48" y="182" fill="#cbd5e1" font-size="24">Useful tools. Thoughtful interfaces.</text>
<text x="48" y="215" fill="#94a3b8" font-size="16">Building practical Windows apps, one idea at a time.</text>
