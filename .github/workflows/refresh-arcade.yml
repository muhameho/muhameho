name: Refresh Contribution Invaders

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_arcade.py
      - .github/workflows/refresh-arcade.yml

permissions:
  contents: write

concurrency:
  group: contribution-invaders
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Render actual public contributions
        run: python scripts/generate_arcade.py --user muhameho
      - name: Save refreshed calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contribution-invaders.svg
          if git diff --cached --quiet; then
            echo 'Calendar is already current.'
            exit 0
          fi
          git commit -m 'Refresh contribution arcade [skip ci]'
          git push
